name: Build HoangHaMod iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App with xcodebuild
        run: |
          cd ios-app
          xcodebuild build \
            -scheme HoangHaMod \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=../build_output

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "HoangHaMod.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            mkdir -p Payload/HoangHaMod.app
            cp -R ios-app/.build/release/HoangHaMod Payload/HoangHaMod.app/HoangHaMod 2>/dev/null || true
          else
            cp -R "$APP_PATH" Payload/
          fi
          zip -r HoangHaMod_v3.0_VIP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoangHaMod_v3.0_VIP.ipa
          path: HoangHaMod_v3.0_VIP.ipa
