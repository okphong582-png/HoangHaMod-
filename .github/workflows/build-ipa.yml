name: Build HoangHaMod iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compile iOS ARM64 App Binary
        run: |
          mkdir -p Payload/HoangHaMod.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun --sdk iphoneos swiftc -O \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -emit-executable \
            -o Payload/HoangHaMod.app/HoangHaMod \
            ios-app/Sources/HoangHaModApp.swift \
            ios-app/Sources/Services/VPNManager.swift \
            ios-app/Sources/Views/LoginView.swift \
            ios-app/Sources/Views/MainDashboardView.swift

          cp ios-app/Resources/Info.plist Payload/HoangHaMod.app/Info.plist
          cp hoangha_vip.png Payload/HoangHaMod.app/AppIcon60x60@2x.png 2>/dev/null || true
          cp hoangha_vip.png Payload/HoangHaMod.app/icon.png 2>/dev/null || true
          echo -n "APPL????" > Payload/HoangHaMod.app/PkgInfo

      - name: Package Payload into IPA
        run: |
          zip -r HoangHaMod_v3.0_VIP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoangHaMod_v3.0_VIP.ipa
          path: HoangHaMod_v3.0_VIP.ipa
